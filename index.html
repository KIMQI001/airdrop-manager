<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAO Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0a0a0f;
            min-height: 100vh;
        }
        .gradient-border {
            position: relative;
            background: linear-gradient(#141419, #141419) padding-box,
                        linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899) border-box;
            border: 1px solid transparent;
        }
        .glow {
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.15);
        }
    </style>
</head>
<body class="text-white">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                    <span class="text-lg font-bold">◆</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold">DAO Dashboard</h1>
                    <p class="text-xs text-gray-500">Airdrop Tracker</p>
                </div>
            </div>
            <button onclick="selectFolder()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition">
                Select Data Folder
            </button>
        </header>

        <!-- Treasury Balance -->
        <div class="gradient-border rounded-2xl p-6 mb-6 glow">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm mb-1">Treasury Balance</p>
                    <p id="total-balance" class="text-4xl font-bold">$0</p>
                </div>
                <div class="text-right">
                    <p class="text-gray-400 text-sm mb-1">Wallets</p>
                    <p id="wallet-count" class="text-2xl font-bold text-indigo-400">0</p>
                </div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Projects List -->
            <div class="bg-[#141419] rounded-2xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Projects</h2>
                    <button onclick="showAddProjectModal()" class="text-indigo-400 hover:text-indigo-300 text-sm">+ Add</button>
                </div>
                <div id="projects-list" class="space-y-3">
                    <p class="text-gray-500 text-sm">No projects yet</p>
                </div>
            </div>

            <!-- Activity Feed -->
            <div class="bg-[#141419] rounded-2xl p-6">
                <h2 class="text-lg font-semibold mb-4">Activity</h2>
                <div id="activity-feed" class="space-y-3 max-h-80 overflow-y-auto">
                    <p class="text-gray-500 text-sm">No activity yet</p>
                </div>
            </div>
        </div>

        <!-- Wallets Table -->
        <div class="mt-6 bg-[#141419] rounded-2xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">Wallets</h2>
                <button onclick="showAddWalletModal()" class="text-indigo-400 hover:text-indigo-300 text-sm">+ Add</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="text-gray-500 text-xs uppercase">
                            <th class="text-left pb-3">Label</th>
                            <th class="text-left pb-3">Address</th>
                            <th class="text-left pb-3">Network</th>
                            <th class="text-right pb-3">Balance</th>
                            <th class="text-right pb-3"></th>
                        </tr>
                    </thead>
                    <tbody id="wallets-table" class="text-sm">
                        <tr><td colspan="5" class="py-4 text-gray-500">No wallets</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
        <div class="bg-[#141419] rounded-2xl p-6 w-full max-w-md mx-4 gradient-border">
            <h3 id="modal-title" class="text-lg font-semibold mb-4">Modal</h3>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
