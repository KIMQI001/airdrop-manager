<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAO Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                    },
                    colors: {
                        surface: '#0d0d12',
                        card: '#14141b',
                        border: '#1f1f2e',
                        accent: '#6366f1',
                        'accent-hover': '#818cf8',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0d0d12;
            min-height: 100vh;
        }
        .card {
            background: #14141b;
            border: 1px solid #1f1f2e;
            border-radius: 16px;
        }
        .glow-accent {
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.15);
        }
        .input {
            background: #0d0d12;
            border: 1px solid #1f1f2e;
            border-radius: 8px;
            color: #fff;
            padding: 10px 14px;
            width: 100%;
            transition: border-color 0.2s;
        }
        .input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .input::placeholder {
            color: #6b7280;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        .btn-primary:hover {
            background: #818cf8;
        }
        .btn-secondary {
            background: #1f1f2e;
            color: #9ca3af;
        }
        .btn-secondary:hover {
            background: #2a2a3d;
            color: #fff;
        }
    </style>
</head>
<body class="text-white">
    <div class="max-w-6xl mx-auto px-6 py-8">
        <!-- Header -->
        <header class="flex items-center justify-between mb-10">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center">
                    <i data-lucide="hexagon" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">DAO Dashboard</h1>
                    <p class="text-gray-500 text-sm">Airdrop Portfolio Tracker</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="showSettingsModal()" class="btn btn-secondary flex items-center gap-2">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    Settings
                </button>
                <button onclick="selectFolder()" class="btn btn-primary flex items-center gap-2">
                    <i data-lucide="folder-open" class="w-4 h-4"></i>
                    Select Folder
                </button>
            </div>
        </header>

        <!-- Treasury Stats -->
        <div class="card p-6 mb-6 glow-accent">
            <div class="flex items-center justify-between">
                <div>
                    <div class="flex items-center gap-2 mb-2">
                        <i data-lucide="wallet" class="w-4 h-4 text-indigo-400"></i>
                        <span class="text-gray-400 text-sm font-medium">Treasury Balance</span>
                    </div>
                    <p id="total-balance" class="text-5xl font-bold tracking-tight">$0</p>
                </div>
                <div class="text-right">
                    <div class="flex items-center justify-end gap-2 mb-2">
                        <i data-lucide="layers" class="w-4 h-4 text-purple-400"></i>
                        <span class="text-gray-400 text-sm">Projects</span>
                    </div>
                    <p id="project-count" class="text-3xl font-bold text-purple-400">0</p>
                </div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Projects -->
            <div class="card p-6">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-2">
                        <i data-lucide="rocket" class="w-5 h-5 text-indigo-400"></i>
                        <h2 class="text-lg font-semibold">Projects</h2>
                    </div>
                    <button onclick="showAddProjectModal()" class="text-indigo-400 hover:text-indigo-300 flex items-center gap-1 text-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Add
                    </button>
                </div>
                <div id="projects-list" class="space-y-3 max-h-80 overflow-y-auto pr-2">
                    <p class="text-gray-500 text-sm py-4 text-center">No projects yet</p>
                </div>
            </div>

            <!-- Activity -->
            <div class="card p-6">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-2">
                        <i data-lucide="activity" class="w-5 h-5 text-emerald-400"></i>
                        <h2 class="text-lg font-semibold">Activity</h2>
                    </div>
                    <button onclick="showAddActivityModal()" class="text-indigo-400 hover:text-indigo-300 flex items-center gap-1 text-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Add
                    </button>
                </div>
                <div id="activity-feed" class="space-y-3 max-h-80 overflow-y-auto pr-2">
                    <p class="text-gray-500 text-sm py-4 text-center">No activity yet</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="card p-6 w-full max-w-md mx-4">
            <div class="flex items-center justify-between mb-6">
                <h3 id="modal-title" class="text-lg font-semibold">Modal</h3>
                <button onclick="hideModal()" class="text-gray-500 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
